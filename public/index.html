<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leanin · 本地版 — 解析链接 / 音视频转写 / AI 总结</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f1f1d'/%3E%3Cpath d='M11 8v13h10v3H8V8h3z' fill='%23ff6e1e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="banner" class="banner" hidden>
  <span class="banner-icon">ⓘ</span>
  <span id="banner-text">所有数据仅保存在本机（浏览器 + 本地服务），不经过任何第三方服务器。</span>
  <button class="banner-close" id="banner-close" title="关闭">✕</button>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="logo-row">
      <div class="logo">Leanin <span class="logo-tag">本地</span></div>
    </div>
    <nav class="nav">
      <a class="nav-item active" href="#/workbench" data-nav="workbench">
        <span class="nav-ic" data-ic="home"></span>工作台
      </a>
      <a class="nav-item" href="#/tags" data-nav="tags">
        <span class="nav-ic" data-ic="tag"></span>标签
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" id="btn-record-nav">
        <span class="nav-ic" data-ic="mic"></span>实时录音
      </button>
      <button class="nav-item" id="btn-export-data">
        <span class="nav-ic" data-ic="download"></span>导出数据
      </button>
      <button class="nav-item" id="btn-import-data">
        <span class="nav-ic" data-ic="upload"></span>导入数据
      </button>
      <button class="nav-item" id="btn-settings">
        <span class="nav-ic" data-ic="gear"></span>设置
      </button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
  </aside>
  <main id="main" class="main"></main>
</div>

<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast-root" class="toast-root"></div>
<audio id="player" hidden></audio>

<script type="module" src="js/app.js"></script>
</body>
</html>
